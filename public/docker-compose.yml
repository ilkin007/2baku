version: '3'

services:
  apache:
    image: httpd:2.4
    volumes:
      - ./:/var/www/html
      - ./Docker/httpd/httpd.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - php
      - db

  nginx:
    image: nginx:1.13
    ports:
      - 80:80
    volumes:
      - ./:/var/www/html
      - ./Docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - apache

  php:
    image: devilbox/php-fpm:8.1-mods
    volumes:
      - ./:/var/www/html
      - ./Docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./Docker/php/xxx-devilbox-default-php.ini:/usr/local/etc/php/conf.d/xxx-devilbox-default-php.ini

  db:
    image: mysql:5.7
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: app_db
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_user_pass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - 8080:80

  selenium1:
    image: selenium/standalone-chrome-debug
    ports:
      - 5900:5900

volumes:
  dbdata:
